name: Platform Login Edge Cache Isolation
on:
  push:
    branches: [audit/platform-multilayer-20261017]
    paths:
      - '.github/workflows/platform-login-edge-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login-edge-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile tools/platform_login_cache_probe.py
      - name: Compare independent login sessions and UTM cache
        run: python3 tools/platform_login_cache_probe.py
      - name: Sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-login-edge-cache
          path: platform-login-cache-fingerprint.json
          retention-days: 7
