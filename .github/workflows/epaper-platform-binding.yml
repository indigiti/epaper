name: ePaper Platform Binding Regression (EP-DI)

on:
  push:
    branches: [cw-epaper, main]
    paths:
      - 'app/**'
      - 'codebase/app/**'
      - 'config/**'
      - 'codebase/config/**'
      - 'tests/epdi-platform-binding-contract.php'
      - 'codebase/tests/epdi-platform-binding-contract.php'
      - 'public_html/assets/reader-ui-visibility.css'
      - 'public_html/service-worker.js'
      - 'codebase/public_html/service-worker.js'
      - 'public_html/.htaccess'
      - 'codebase/public_html/.htaccess'
      - 'public_html/manifest.webmanifest'
      - 'codebase/public_html/manifest.webmanifest'
      - 'tests/pwa-manifest-contract.php'
      - 'codebase/tests/pwa-manifest-contract.php'
      - 'public_html/assets/reader-edge-navigation.js'
      - 'public_html/assets/reader-edge-navigation.css'
      - 'codebase/public_html/assets/reader-edge-navigation.js'
      - 'codebase/public_html/assets/reader-edge-navigation.css'
      - 'tests/reader-edge-navigation-contract.php'
      - 'codebase/tests/reader-edge-navigation-contract.php'
      - 'codebase/public_html/assets/reader-ui-visibility.css'
      - 'tests/reader-ui-visibility.php'
      - 'codebase/tests/reader-ui-visibility.php'
      - 'tests/login-storage-tenant-contract.php'
      - 'codebase/tests/login-storage-tenant-contract.php'
      - 'tests/settings-route-reachability.php'
      - 'codebase/tests/settings-route-reachability.php'
      - '.github/workflows/epaper-platform-binding.yml'
  pull_request:
    branches: [cw-epaper, main]
    paths:
      - 'app/**'
      - 'codebase/app/**'
      - 'config/**'
      - 'codebase/config/**'
      - 'tests/epdi-platform-binding-contract.php'
      - 'codebase/tests/epdi-platform-binding-contract.php'
      - 'public_html/assets/reader-ui-visibility.css'
      - 'public_html/service-worker.js'
      - 'codebase/public_html/service-worker.js'
      - 'public_html/.htaccess'
      - 'codebase/public_html/.htaccess'
      - 'public_html/manifest.webmanifest'
      - 'codebase/public_html/manifest.webmanifest'
      - 'tests/pwa-manifest-contract.php'
      - 'codebase/tests/pwa-manifest-contract.php'
      - 'public_html/assets/reader-edge-navigation.js'
      - 'public_html/assets/reader-edge-navigation.css'
      - 'codebase/public_html/assets/reader-edge-navigation.js'
      - 'codebase/public_html/assets/reader-edge-navigation.css'
      - 'tests/reader-edge-navigation-contract.php'
      - 'codebase/tests/reader-edge-navigation-contract.php'
      - 'codebase/public_html/assets/reader-ui-visibility.css'
      - 'tests/reader-ui-visibility.php'
      - 'codebase/tests/reader-ui-visibility.php'
      - 'tests/login-storage-tenant-contract.php'
      - 'codebase/tests/login-storage-tenant-contract.php'
      - 'tests/settings-route-reachability.php'
      - 'codebase/tests/settings-route-reachability.php'
      - '.github/workflows/epaper-platform-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Enforce no private runtime config or uploaded media
        run: python3 codebase/tests/security-source-guard.py
      - name: Cloudways root and codebase runtime parity
        run: python3 codebase/tests/branch-layout-parity.py
      - name: PHP syntax validation
        run: |
          set -euo pipefail
          for file in app/Services/PlatformBinding.php app/Services/DomainResolver.php app/App.php config/config.example.php tests/epdi-platform-binding-contract.php codebase/app/Services/PlatformBinding.php codebase/app/Services/DomainResolver.php codebase/app/App.php codebase/config/config.example.php codebase/tests/epdi-platform-binding-contract.php; do
            php -l "$file"
          done
      - name: Production product-key migration and cross-tenant regression
        run: |
          php tests/epdi-platform-binding-contract.php
          php codebase/tests/epdi-platform-binding-contract.php
      - name: Existing authentication tenant escaping contract
        run: |
          php tests/auth-tenant-escaping.php
          php codebase/tests/auth-tenant-escaping.php
      - name: Per-publisher public interface visibility and reader safety
        run: |
          php -l app/Services/ReaderUiControls.php
          php -l codebase/app/Services/ReaderUiControls.php
          php -l app/Core/View.php
          php -l codebase/app/Core/View.php
          php tests/reader-ui-visibility.php
          php codebase/tests/reader-ui-visibility.php
      - name: Reader edge controls, safety, mirrors and JavaScript parsing
        run: |
          php tests/reader-edge-navigation-contract.php
          php codebase/tests/reader-edge-navigation-contract.php
          node --check public_html/assets/reader-edge-navigation.js
          node --check codebase/public_html/assets/reader-edge-navigation.js
      - name: Tenant-specific PWA identity and manifest isolation
        run: |
          php -l app/Services/PwaManifest.php
          php -l codebase/app/Services/PwaManifest.php
          php tests/pwa-manifest-contract.php
          php codebase/tests/pwa-manifest-contract.php
          node --check public_html/service-worker.js
          node --check codebase/public_html/service-worker.js
      - name: Tenant sign-in visibility and bounded storage checks
        run: |
          php -l app/Core/Auth.php
          php -l codebase/app/Core/Auth.php
          php -l app/Services/TenantResourceReport.php
          php -l codebase/app/Services/TenantResourceReport.php
          php -l app/Controllers/TenantStorageController.php
          php -l codebase/app/Controllers/TenantStorageController.php
          php tests/login-storage-tenant-contract.php
          php codebase/tests/login-storage-tenant-contract.php
      - name: Every admin settings tab has a working GET/POST dispatcher
        run: |
          php -l app/Services/SettingsCatalog.php
          php -l codebase/app/Services/SettingsCatalog.php
          php tests/settings-route-reachability.php
          php codebase/tests/settings-route-reachability.php
      - name: WebDesk restricted publishing role and hostile POST request tests
        run: |
          php -l app/Views/WebDeskEditionView.php
          php -l codebase/app/Views/WebDeskEditionView.php
          php -l app/Views/ManualClippingView.php
          php -l codebase/app/Views/ManualClippingView.php
          php tests/webdesk-permissions.php
          php codebase/tests/webdesk-permissions.php
      - name: Clipping cache regression (Cloudways PHP disabled link)
        run: |
          php -l app/Services/ClipCropCache.php
          php -l codebase/app/Services/ClipCropCache.php
          php tests/clip-crop-cache.php
          php codebase/tests/clip-crop-cache.php
          php -d disable_functions=link tests/clip-crop-cache.php
          php -d disable_functions=link codebase/tests/clip-crop-cache.php
          php tests/clip-api-safe-error-contract.php
          php codebase/tests/clip-api-safe-error-contract.php
