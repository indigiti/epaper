name: EP-DI AI Candidate Integration (Staging)
on:
  push:
    branches:
      - feature/ai-article-review-worker-20261018
  pull_request:
    paths:
      - 'codebase/ai_processing/**'
      - 'codebase/bin/ai-*'
      - 'codebase/tests/test_ai_*.py'
      - 'codebase/tests/ai-review-static.php'
      - 'codebase/tests/ai-review-mariadb.php'
      - 'codebase/app/Services/AiCandidatePipeline.php'
      - 'codebase/app/Services/AiEditorialReview.php'
      - 'codebase/app/Services/ProcessingPipeline.php'
      - 'codebase/app/App.php'
      - 'codebase/app/Core/View.php'
      - 'codebase/config/config.example.php'
      - 'codebase/database/upgrade-ai-page-candidates-20261018.sql'
      - '.github/workflows/epdi-ai-candidate-integration.yml'
permissions:
  contents: read
jobs:
  source-and-fixtures:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: epdi_ci_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql, mbstring
      - name: Install pinned optional OpenCV for synthetic image test
        working-directory: codebase
        run: python -m pip install -r ai_processing/requirements-image.txt
      - name: Python review-only contracts and CLI integration
        working-directory: codebase
        run: python -m unittest discover -s tests -p 'test_ai_*.py' -v
      - name: Python bytecode
        working-directory: codebase
        run: python -m compileall -q ai_processing bin/ai-ocr-normalize.py bin/ai-layout-preview.py bin/ai-candidate-generate.py
      - name: PHP syntax and security source contract
        working-directory: codebase
        run: |
          set -euo pipefail
          php -l app/Services/AiCandidatePipeline.php
          php -l app/Services/AiEditorialReview.php
          php -l app/Services/ProcessingPipeline.php
          php -l app/App.php
          php -l app/Core/View.php
          php tests/ai-review-static.php
          php -l tests/ai-review-mariadb.php
      - name: Disposable MariaDB tenant and revision acceptance
        working-directory: codebase
        env:
          EPDI_AI_TEST_DB_HOST: 127.0.0.1
          EPDI_AI_TEST_DB_USER: root
          EPDI_AI_TEST_DB_PASSWORD: epdi_ci_only_password
        run: php tests/ai-review-mariadb.php
