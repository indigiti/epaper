name: Cloudways ePaper AI and Publishing Staging
on:
  push:
    branches: [cw-epaper]
  pull_request:
    branches: [cw-epaper]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: epdi_ci_only_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Guard secrets and Cloudways/root source parity
        run: |
          python3 codebase/tests/security-source-guard.py
          python3 codebase/tests/branch-layout-parity.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - run: python -m pip install -r ai_processing/requirements-image.txt
      - name: Synthetic staging candidate end-to-end smoke
        run: |
          python bin/ai-clipping-smoke.py
          python bin/ai-clipping-probe.py
      - run: python -m unittest discover -s tests -p 'test_ai_*.py' -v
      - name: Validate read-only Cloudways acceptance runner (no live network)
        run: |
          python -m py_compile tests/staging_acceptance.py
          python tests/staging_acceptance.py --help > /dev/null
      - name: Read-only Cloudways public route acceptance (non-blocking evidence)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python tests/public_route_diagnostics.py
          python tests/staging_acceptance.py --only epaper
      - run: python -m compileall -q ai_processing bin/ai-ocr-normalize.py bin/ai-layout-preview.py bin/ai-candidate-generate.py bin/ai-clipping-probe.py bin/ai-clipping-smoke.py
      - run: |
          set -e
          php -l app/App.php
          php -l app/Core/View.php
          php -l app/Services/EditionPageSequence.php
          php -l app/Services/EditionRemoval.php
          php -l app/Services/AiEditorialReview.php
          php -l app/Services/AiCandidatePipeline.php
          php -l bin/ai-clipping-staging.php
          php tests/ai-clipping-staging-contract.php
          php -l app/Services/AiClippingReadiness.php
          php -l app/Services/AiClippingWebSetup.php
          php -l app/Services/AiClippingActivation.php
          php -l app/Services/AiClippingDependencies.php
          php tests/ai-clipping-web-setup.php
          php -l app/Repositories/SqlAiClippingReadinessRepository.php
          php -l app/Controllers/AdminAiClippingController.php
          php -l app/Views/AiClippingReadinessView.php
          php tests/ai-clipping-readiness-contract.php
          php -l app/Controllers/StagingAcceptanceController.php
          php -l app/Core/View.php
          php -l app/Services/StagingAcceptance.php
          php -l app/Services/StagingActionPlan.php
          php -l app/Services/ProductionReadiness.php
          php -l app/Repositories/SqlAcceptanceMetricsRepository.php
          php -l app/Contracts/AcceptanceMetricsRepository.php
          php -l app/Services/ProcessingPipeline.php
          php tests/ai-review-static.php
          php tests/admin-acceptance-static.php
          php tests/admin-workspace-contracts.php
          php -l app/Controllers/AdminAuditController.php
          php tests/admin-audit-contract.php
          php -l app/Services/AdminRoutePolicy.php
          php tests/admin-route-policy.php
          php tests/admin-query-bounds.php
          php -l app/Services/SemanticNews.php
          node --check public_html/assets/admin-sidebar.js
          php tests/auth-tenant-escaping.php
           node tests/reader-editorial-recovery.test.js
           php tests/reader-visual-safety-contract.php
           php tests/upgrade-center-contract.php
          php -l app/Controllers/AdminManualClippingController.php
          php -l app/Views/ManualClippingView.php
          php -l app/Services/ManualClipGeometry.php
          php -l app/Services/ClipService.php
          php -l app/Services/ManualClipMarking.php
          php -l app/Controllers/AdminManualClippingController.php
          php -l app/Views/ManualClippingView.php
          php -l app/Services/SchemaDoctor.php
          php tests/manual-clipping-contract.php
          php -l app/Services/ReaderEditionChoices.php
          php tests/reader-edition-navigation-contract.php
          node --check public_html/assets/reader-editorial-clips.js
          node --check public_html/assets/reader.js
          node --check public_html/assets/reader-swipe-feedback.js
          php tests/reader-swipe-feedback-contract.php
          php tests/clip-ui-compact-contract.php
          php -l app/Services/ClipCropCache.php
          php -l app/Services/ClipService.php
          php -l app/Services/ManualClipMarking.php
          php -l app/Services/SchemaDoctor.php
          php tests/clip-crop-cache.php
          # Mirror Cloudways PHP-FPM hardening. Disabled PHP builtins disappear,
          # and calling link() without function_exists triggers a fatal Error.
          php -d disable_functions=link tests/clip-crop-cache.php
          php -d disable_functions=link codebase/tests/clip-crop-cache.php
          php tests/clip-reuse-contract.php
          php -l app/Services/OfficialClipService.php
          php tests/official-clip-contract.php
          node --check public_html/assets/reader-editorial-clips.js
          node --check public_html/assets/app.js
          node --check public_html/assets/manual-clipping.js
          node --check public_html/assets/manual-clipping.js
          php tests/editorial-action-center.php
          php -l app/Services/EditorialActionCenter.php
          php -l app/Services/EditorialActionView.php
          php -l app/Repositories/SqlEditorialActionRepository.php
          php -l app/Contracts/EditorialActionRepository.php
          php -l app/Services/AdminFeatureCatalog.php
          php -l app/Services/AdminWorkspace.php
          node --check public_html/assets/admin-workspace.js
      - env:
          EPDI_AI_TEST_DB_HOST: 127.0.0.1
          EPDI_AI_TEST_DB_USER: root
          EPDI_AI_TEST_DB_PASSWORD: epdi_ci_only_password
        run: php tests/ai-review-mariadb.php
      - name: Official clipping MariaDB access controls (disposable)
        env:
          EPDI_OFFICIAL_CI: '1'
          EPDI_AI_TEST_DB_HOST: 127.0.0.1
          EPDI_AI_TEST_DB_USER: root
          EPDI_AI_TEST_DB_PASSWORD: epdi_ci_only_password
        run: php tests/official-clip-mariadb.php
  public-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Public responsive browser acceptance with PR reader assets
        run: python tests/browser_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epaper-public-browser-smoke
          path: qa-artifacts/
          retention-days: 7

  frontend-themes:
    name: Five frontend themes (Cloudways layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - name: PHP syntax and Cloudways theme contracts
        run: |
          php -l app/App.php
          php -l app/Core/View.php
          php -l app/Services/ThemeCatalog.php
          php -l app/Services/FrontendHomeLayouts.php
          php -l app/Services/SettingsCatalog.php
          php tests/frontend-cloudways-contract.php
          php -l app/Services/PublicHalo.php
          php tests/home-halo-contract.php
          php -l app/Services/BackgroundEffects.php
          php -l app/Services/BackgroundEffectsStudio.php
          php tests/background-effects-contract.php --fixtures
          php -l app/Core/Build.php
          php tests/immutable-asset-cache-contract.php
          node --check public_html/service-worker.js
          node tests/immutable-asset-cache.test.mjs
          php tests/frontend-layouts.php --fixtures
          php -l app/Services/ReaderHub.php
          php tests/reader-hub-contract.php --fixtures
          php -l app/Services/AdminIcons.php
          php -l app/Services/AppearanceGallery.php
          php -l app/Services/AdminDashboardVisuals.php
          php tests/admin-redesign-contract.php
          php tests/admin-workspace-contracts.php
          php tests/admin-route-policy.php
          node --check public_html/assets/admin-sidebar.js
          node --check public_html/assets/admin-appearance-gallery.js
          node --check tests/admin-design-browser.mjs
          node --check public_html/assets/app.js
      - name: Generate desktop and mobile browser previews
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/frontend-home-browser.mjs
          node --check public_html/assets/home-halo.js
          node --check public_html/assets/vendor/vanta.halo.0.5.24.min.js
          node --check public_html/assets/vendor/three.r134.min.js
          node tests/home-halo-browser.mjs
          node tests/home-halo-real-browser.mjs
          node --check public_html/assets/vanta-config.js
          node --check public_html/assets/admin-effects.js
          node tests/background-effects-browser.mjs
          for effect in waves net dots rings clouds cells fog; do node --check "public_html/assets/vendor/vanta.$effect.0.5.24.min.js"; done
          node --check tests/live-halo-asset-diagnostic.mjs
          node tests/admin-design-browser.mjs
          node tests/reader-hub-browser.mjs
      - name: Advisory check of currently deployed public HALO CSS
        continue-on-error: true
        run: node tests/live-halo-asset-diagnostic.mjs
      - name: Preserve Reader Hub desktop/mobile preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-epaper-reader-hub-previews
          path: tests/reader-hub-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve background effects customizer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-epaper-background-effects-studio
          path: tests/effects-studio-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve HALO desktop and mobile fallback screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-epaper-halo-previews
          path: tests/home-halo-previews/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve redesigned dashboard theme previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-epaper-admin-redesign-previews
          path: tests/admin-redesign-previews/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve desktop and mobile theme review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-epaper-five-frontend-previews
          path: tests/frontend-layout-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
