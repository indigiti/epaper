name: cw-platform onboarding checks

on:
  push:
    branches: [cw-platform]
    paths:
      - 'app/**'
      - 'public_html/**'
      - 'config/**'
      - 'bin/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/cw-platform-onboarding.yml'
  pull_request:
    branches: [cw-platform]
    paths:
      - 'app/**'
      - 'public_html/**'
      - 'config/**'
      - 'database/**'
      - 'bin/**'
      - 'tests/**'
      - '.github/workflows/cw-platform-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: platform-ci-only
          MYSQL_DATABASE: platform_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax lint
        run: find app public_html bin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Onboarding contract checks
        run: php tests/onboarding-source-contract.php
      - name: Application connection setup, tenant isolation and no-secret preview
        run: php tests/app-connection-setup.php
      - name: Publisher login prerequisite and restricted grant contracts
        run: php tests/publisher-login-check.php
      - name: Tenant-scoped WebDesk publisher role management
        run: php tests/platform-webdesk-role.php
      - name: Shared ePaper application and existing publisher domain recovery
        run: php tests/shared-app-recovery.php
      - name: Operator UI behaviour and navigation smoke checks
        run: php tests/operator-ui-checks.php
      - name: Registry icon, restoration and staging reset checks
        run: php tests/registry-action-checks.php
      - name: Cross-module functional and recovery audit
        run: php tests/platform-functional-audit.php
      - name: Platform-wide security and operation audit checks
        run: php tests/platform-security-audit.php
      - name: Schema and real MySQL publisher recovery integration
        env:
          PLATFORM_TEST_MYSQL: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: platform_ci
          MYSQL_USER: root
          MYSQL_PASSWORD: platform-ci-only
        run: php tests/platform-mysql-integration.php
