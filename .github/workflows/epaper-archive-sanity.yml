name: EP-DI Archive Integrity and PHP Regression

on:
  push:
    branches: [main, refactor/main-docs-cleanup-20261017]
  pull_request:
    paths:
      - 'codebase/docs/**'
      - 'codebase/release/**'
      - 'codebase/app/**'
      - 'codebase/public_html/**'
      - 'codebase/bin/**'
      - 'codebase/tests/**'
      - 'codebase/README.md'
      - '.github/workflows/epaper-archive-sanity.yml'

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify source tree excludes credentials and newspaper media
        run: python3 codebase/tests/security-source-guard.py
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codebase
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, json, sockets, openssl, fileinfo, zip
          coverage: none
      - name: Verify relocated release files and original Git hashes
        run: php tests/legacy-archive-layout.php
      - name: Composer dependency validation
        run: |
          composer validate --no-check-publish
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: PHP syntax
        run: |
          set -euo pipefail
          find app bin tests public_html -type f -name '*.php' -not -path '*/uploads/*' -print0 | xargs -0 -n1 php -l > /tmp/epdi-php-lint.txt
      - name: Reader interaction JavaScript regression
        run: node tests/reader-interaction-regression.mjs
      - name: Validate private configuration of both applications
        run: |
          php tests/config-private-runtime.php
          php ../platform/tests/config-private-runtime.php
          find ../platform/app ../platform/bin ../platform/tests ../platform/public_html -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/platform-php-lint.txt
      - name: Independent frontend and reader theme regression
        run: php tests/theme-isolation.php
      - name: Four distinct frontend template regression
        run: php tests/frontend-layouts.php --fixtures
      - name: Chromium browser smoke for frontend and reader skins
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
          node tests/theme-browser-smoke.mjs
          node tests/frontend-home-browser.mjs
      - name: Real staging reader E2E, accessibility and responsive evidence
        env:
          EPDI_READER_TEST_URL: ${{ secrets.EPDI_READER_TEST_URL }}
          EPDI_TEST_UNPUBLISHED_PAGE_GUID: ${{ secrets.EPDI_TEST_UNPUBLISHED_PAGE_GUID }}
        run: node tests/reader-live-browser.mjs
      - name: Upload staging reader screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-reader-e2e
          path: codebase/tests/reader-live-screenshots/*
          if-no-files-found: ignore
      - name: Upload frontend layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-layout-browser-previews
          path: codebase/tests/frontend-layout-screenshots/*.png
          if-no-files-found: ignore
      - name: Upload synthetic theme preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-browser-fixtures
          path: codebase/tests/theme-preview-artifacts/*.png
          if-no-files-found: ignore
      - name: Existing complete source regressions
        run: php bin/release-check.php
