name: EP-DI Archive Integrity and PHP Regression

on:
  push:
    branches: [main, refactor/main-docs-cleanup-20261017]
  pull_request:
    paths:
      - 'codebase/docs/**'
      - 'codebase/release/**'
      - 'codebase/app/**'
      - 'codebase/public_html/**'
      - 'codebase/bin/**'
      - 'codebase/tests/**'
      - 'codebase/README.md'
      - '.github/workflows/epaper-archive-sanity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codebase
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, json, sockets, openssl, fileinfo, zip
          coverage: none
      - name: Verify relocated release files and original Git hashes
        run: php tests/legacy-archive-layout.php
      - name: Composer dependency validation
        run: |
          composer validate --no-check-publish
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: PHP syntax
        run: |
          set -euo pipefail
          find app bin tests public_html -type f -name '*.php' -not -path '*/uploads/*' -print0 | xargs -0 -n1 php -l > /tmp/epdi-php-lint.txt
      - name: Independent frontend and reader theme regression
        run: php tests/theme-isolation.php
      - name: Chromium browser smoke for frontend and reader skins
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/theme-browser-smoke.mjs
      - name: Upload synthetic theme preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-browser-fixtures
          path: codebase/tests/theme-preview-artifacts/*.png
          if-no-files-found: ignore
      - name: Existing complete source regressions
        run: php bin/release-check.php
