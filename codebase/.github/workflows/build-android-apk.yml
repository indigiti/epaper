name: Build EP-DI Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/build-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EPDI_UPLOAD_KEYSTORE_B64: ${{ secrets.EPDI_UPLOAD_KEYSTORE_B64 }}
      EPDI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.EPDI_UPLOAD_KEYSTORE_PASSWORD }}
      EPDI_UPLOAD_KEY_ALIAS: ${{ secrets.EPDI_UPLOAD_KEY_ALIAS }}
      EPDI_UPLOAD_KEY_PASSWORD: ${{ secrets.EPDI_UPLOAD_KEY_PASSWORD }}
      EPDI_FIREBASE_APPLICATION_ID: ${{ vars.EPDI_FIREBASE_APPLICATION_ID }}
      EPDI_FIREBASE_API_KEY: ${{ vars.EPDI_FIREBASE_API_KEY }}
      EPDI_FIREBASE_PROJECT_ID: ${{ vars.EPDI_FIREBASE_PROJECT_ID }}
      EPDI_FIREBASE_SENDER_ID: ${{ vars.EPDI_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare optional Play upload keystore
        if: ${{ env.EPDI_UPLOAD_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          printf '%s' "$EPDI_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/epdi-upload.jks"
      - name: Build debug APK, lint and release AAB
        working-directory: mobile-android
        env:
          EPDI_KEYSTORE_FILE: ${{ runner.temp }}/epdi-upload.jks
          EPDI_KEYSTORE_PASSWORD: ${{ env.EPDI_UPLOAD_KEYSTORE_PASSWORD }}
          EPDI_KEY_ALIAS: ${{ env.EPDI_UPLOAD_KEY_ALIAS }}
          EPDI_KEY_PASSWORD: ${{ env.EPDI_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon clean lintDebug assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: EP-DI-2.0.2.0-android-debug
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EP-DI-2.0.2.0-android-release-aab
          path: mobile-android/app/build/outputs/bundle/release/app-release.aab
