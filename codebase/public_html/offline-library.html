<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6fa"><meta name="robots" content="noindex,nofollow"><title>Offline Library · ePaper</title><link rel="stylesheet" href="/assets/offline-vault.css?v=2.0.0"></head><body class="offline-shell"><header class="offline-topbar"><a class="offline-brand" href="/">ePaper · Offline</a><a href="/account/offline">Online Library</a></header><main class="offline-main"><section class="offline-head"><div><span class="eyebrow">ENCRYPTED OFFLINE VAULT</span><h1>Offline Library</h1><p>Downloaded editions remain encrypted on this device and expire automatically.</p></div><span class="offline-storage" data-offline-storage>Checking storage…</span></section><div class="offline-grid" data-offline-library><div class="offline-empty">Loading offline editions…</div></div></main><script>window.EpaperSaas={csrf:'',version:'2.0.0'}</script><script src="/assets/offline-vault.js?v=2.0.0"></script><script>
(async()=>{const host=document.querySelector('[data-offline-library]'),storage=document.querySelector('[data-offline-storage]');try{const rows=await EpdiOfflineVault.library(),st=await EpdiOfflineVault.storage();storage.textContent=st.quota?`${(st.usage/1048576).toFixed(1)} MB used · ${(st.quota/1048576).toFixed(0)} MB available quota`:'Encrypted device storage';if(!rows.length){host.innerHTML='<div class="offline-empty"><h2>No offline editions</h2><p>When online, open an edition and choose Save Offline.</p><a class="btn primary" href="/">Open ePaper</a></div>';return}host.innerHTML='';for(const r of rows){const card=document.createElement('article');card.className='offline-card';const expiry=new Date(r.expires_at);card.innerHTML=`<span class="eyebrow">OFFLINE · ENCRYPTED</span><h2>${r.title||r.publication_name||r.slug||'Saved edition'}</h2><p>${r.edition_date||''} · ${r.page_count||0} pages</p><small>Available until ${expiry.toLocaleString()}</small><div class="offline-actions"><a class="btn primary" href="/offline-reader.html?license=${encodeURIComponent(r.license_guid)}&page=1">Read offline</a><button class="btn danger" type="button">Remove</button></div>`;card.querySelector('button').onclick=async()=>{await EpdiOfflineVault.removeLicense(r.license_guid);card.remove();if(!host.children.length)location.reload()};host.append(card)}}catch(e){host.innerHTML=`<div class="offline-empty"><h2>Offline Vault unavailable</h2><p>${String(e.message||e)}</p></div>`}})();
</script></body></html>
